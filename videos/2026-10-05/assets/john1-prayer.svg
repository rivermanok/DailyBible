<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#0b0a08"/><text x="360" y="230" text-anchor="middle" fill="#f2eadc" font-size="54" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">祷告应用</text><line x1="170" y1="272" x2="550" y2="272" stroke="#8f7447" stroke-width="2"/><g fill="#e6cfa6" font-size="36" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><text x="64" y="388">主啊，感谢你来到我们中间，</text><text x="64" y="446">照亮我们、帮助我们。</text><text x="64" y="566">求你使我越来越认识</text><text x="64" y="624">你的崇高、伟大与荣耀；</text><text x="64" y="744">也使我越来越认识自己，</text><text x="64" y="802">更好地活在福音的大能里。</text></g><text x="360" y="1080" text-anchor="middle" fill="#8f836e" font-size="23" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">阿们</text></svg>
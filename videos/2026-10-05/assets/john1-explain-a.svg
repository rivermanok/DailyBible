<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#0b0a08"/><text x="64" y="116" fill="#f2eadc" font-size="44" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">约翰福音 第一章</text><line x1="64" y1="150" x2="656" y2="150" stroke="#8f7447" stroke-width="2"/><text x="64" y="244" fill="#c7a76c" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">经文讲解</text><g fill="#e6cfa6" font-size="35" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><text x="64" y="344">“道”从起初与神同在，</text><text x="64" y="400">进入时间、历史与肉身。</text><text x="64" y="500">约翰用宏大的导论，</text><text x="64" y="556">先把耶稣的神性摆在眼前。</text><text x="64" y="656">“道成肉身”不是抽象概念，</text><text x="64" y="712">而是神的荣耀与恩典，</text><text x="64" y="768">真实进入人的世界。</text></g><text x="64" y="1146" fill="#8f836e" font-size="23" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">经文讲解｜普通话配音</text></svg>
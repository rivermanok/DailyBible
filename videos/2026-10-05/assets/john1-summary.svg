<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#0b0a08"/><text x="64" y="116" fill="#f2eadc" font-size="44" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">约翰福音 第一章</text><line x1="64" y1="150" x2="656" y2="150" stroke="#8f7447" stroke-width="2"/><text x="64" y="244" fill="#c7a76c" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">内容摘要</text><g fill="#e9e1d2" font-size="34" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><text x="80" y="350">1–18节｜导论：道成肉身</text><text x="80" y="420">19–28节｜施洗约翰的见证</text><text x="80" y="490">29–34节｜神的羔羊</text><text x="80" y="560">35–42节｜首批门徒</text><text x="80" y="630">43–51节｜腓力与拿但业</text></g><text x="64" y="842" fill="#c7a76c" font-size="30" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">主线</text><text x="64" y="904" fill="#e9e1d2" font-size="34" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">从“道”来到世界，</text><text x="64" y="958" fill="#e9e1d2" font-size="34" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">到见证、呼召与跟从。</text><text x="64" y="1146" fill="#8f836e" font-size="23" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">经文讲解｜普通话配音</text></svg>
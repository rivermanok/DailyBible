<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#0b0a08"/><text x="64" y="116" fill="#f2eadc" font-size="44" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">约翰福音 第一章</text><line x1="64" y1="150" x2="656" y2="150" stroke="#8f7447" stroke-width="2"/><text x="64" y="244" fill="#c7a76c" font-size="42" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">经文讲解</text><g fill="#e6cfa6" font-size="35" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><text x="64" y="344">施洗约翰不断作见证：</text><text x="64" y="400">“看哪，神的羔羊。”</text><text x="64" y="500">见证带来关注，</text><text x="64" y="556">关注带来呼召与跟从。</text><text x="64" y="656">安得烈、彼得、腓力、拿但业，</text><text x="64" y="712">一步步被带到耶稣面前。</text><text x="64" y="812">第一章由“神是谁”，</text><text x="64" y="868">走向“人怎样回应他”。</text></g><text x="64" y="1146" fill="#8f836e" font-size="23" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">经文讲解｜普通话配音</text></svg>
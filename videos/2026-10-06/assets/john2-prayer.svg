<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280"><rect width="720" height="1280" fill="#0b0a08"/><text x="360" y="210" text-anchor="middle" fill="#f2eadc" font-size="54" font-weight="700" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">祷告应用</text><line x1="170" y1="252" x2="550" y2="252" stroke="#8f7447" stroke-width="2"/><g fill="#e6cfa6" font-size="33" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><text x="58" y="354">神啊，求你赐给我们马利亚一样的</text><text x="58" y="408">信心和爱心，帮助我们在人生的</text><text x="58" y="462">每一个环节都邀请耶稣作主作王。</text><text x="58" y="576">也求主洁净我的内心，</text><text x="58" y="630">洁净我们的教会，</text><text x="58" y="684">使教会和我自己都蒙你的喜悦。</text><text x="58" y="798">求你像坚固十二个使徒那样，</text><text x="58" y="852">坚固每一位肢体的信心，</text><text x="58" y="906">使属灵知识转化为</text><text x="58" y="960">对你的交托和跟从。</text></g><text x="360" y="1080" text-anchor="middle" fill="#8f836e" font-size="23" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">阿们</text></svg>